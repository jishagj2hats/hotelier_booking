<div class="container-xxl py-5">
    <div class="container">
        <div class="text-center wow fadeInUp" data-wow-delay="0.1s">
            <h6 class="section-title text-center text-primary text-uppercase">Room Booking</h6>
            <h1 class="mb-5">Book A <span class="text-primary text-uppercase">Luxury Room</span></h1>
        </div>

        <div class="row g-5">

            <!-- RIGHT FORM -->
            <div class="col-lg-6">
                <div class="wow fadeInUp" data-wow-delay="0.2s">

                    <f:form action="submit" controller="Booking" class="row g-3" object="{booking}"
                        objectName="booking">
                        <f:form.hidden property="room" value="{roomUid}" />

                        <div class="col-md-6">
                            <div class="form-floating">
                                <f:form.textfield class="form-control" id="name" property="name"
                                    placeholder="Your Name" required="required"/>
                                <label for="name">Your Name</label>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="form-floating">
                                <f:form.textfield class="form-control" id="email" property="email"
                                    placeholder="Your Email" required="required"/>
                                <label for="email">Your Email</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-floating">
                                <f:form.textfield type="datetime-local" class="form-control" required="required" property="checkin" />
                                <label>Check In</label>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="form-floating">
                                <f:form.textfield type="datetime-local" class="form-control" required="required" property="checkout" />
                                <label>Check Out</label>
                            </div>
                        </div>



                        <div class="col-md-6">
                            <div class="form-floating">
                                <f:form.select class="form-select" id="adults" property="adults"
                                    options="{1:'Adult 1', 2:'Adult 2', 3:'Adult 3'}" />
                                <label for="adults">Select Adult</label>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="form-floating">
                                <f:form.select class="form-select" id="children" property="children"
                                    options="{0:'Child 0', 1:'Child 1', 2:'Child 2'}" />
                                <label for="children">Select Child</label>
                            </div>
                        </div>

                        <div class="col-12">
                            <div class="form-floating">
                                <f:form.select class="form-select" id="roomSelect" property="roomSelect"
                                    options="{rooms}" optionValueField="uid" optionLabelField="title" />
                                <label for="roomSelect">Select A Room</label>
                            </div>
                        </div>

                        <div class="col-12">
                            <div class="form-floating">
                                <f:form.textarea class="form-control" id="message" property="message"
                                    style="height: 100px" placeholder="Special Request" />
                                <label for="message">Special Request</label>
                            </div>
                        </div>

                        <div class="col-12">
                            <button class="btn btn-primary w-100 py-3" type="submit">Book Now</button>
                        </div>

                    </f:form>


                </div>
            </div>

        </div>
    </div>
</div>
