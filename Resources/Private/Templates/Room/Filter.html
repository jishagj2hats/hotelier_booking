<f:layout name="Default" />

<f:section name="Main">
  <div class="container-xxl py-5">
    <div class="container">

      <div class="text-center wow fadeInUp" data-wow-delay="0.1s">
        <h6 class="section-title text-center text-primary text-uppercase">Our Rooms</h6>
        <h1 class="mb-5">Explore Our <span class="text-primary text-uppercase">Rooms</span></h1>
      </div>

      <!-- FILTER FORM -->
      <div class="filter-bar shadow rounded bg-white p-4 mb-5 wow fadeInUp" data-wow-delay="0.1s">
        <f:form action="filter" controller="Room" pluginName="Rooms"
                extensionName="HotelierBooking" method="post" class="row g-3 align-items-end">

          <div class="col-md-3">
            <label class="form-label fw-semibold">
              <i class="fa fa-calendar text-primary me-1"></i> Check In
            </label>
            <f:form.textfield type="date" name="checkin"
              class="form-control" value="{filterData.checkin}" />
          </div>

          <div class="col-md-3">
            <label class="form-label fw-semibold">
              <i class="fa fa-calendar-check text-primary me-1"></i> Check Out
            </label>
            <f:form.textfield type="date" name="checkout"
              class="form-control" value="{filterData.checkout}" />
          </div>

          <div class="col-md-2">
            <label class="form-label fw-semibold">
              <i class="fa fa-person text-primary me-1"></i> Adults
            </label>
            <f:form.select name="adults" class="form-select"
              value="{filterData.adults}"
              options="{0: 'Any', 1: '1', 2: '2', 3: '3', 4: '4'}" />
          </div>

          <div class="col-md-2">
            <label class="form-label fw-semibold">
              <i class="fa fa-child text-primary me-1"></i> Children
            </label>
            <f:form.select name="children" class="form-select"
              value="{filterData.children}"
              options="{0: 'Any', 1: '1', 2: '2', 3: '3'}" />
          </div>

          <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100 py-2">
              <i class="fa fa-search me-1"></i> Search
            </button>
          </div>

        </f:form>

        <!-- Active filters summary -->
        <f:if condition="{filterData.checkin} || {filterData.adults} || {filterData.children}">
          <div class="mt-3 pt-3 border-top d-flex align-items-center gap-2 flex-wrap">
            <small class="text-muted fw-semibold">Active filters:</small>
            <f:if condition="{filterData.checkin}">
              <span class="badge bg-primary">
                <i class="fa fa-calendar me-1"></i>
                {filterData.checkin} → {filterData.checkout}
              </span>
            </f:if>
            <f:if condition="{filterData.adults}">
              <span class="badge bg-primary">
                <i class="fa fa-person me-1"></i> {filterData.adults} Adults
              </span>
            </f:if>
            <f:if condition="{filterData.children}">
              <span class="badge bg-primary">
                <i class="fa fa-child me-1"></i> {filterData.children} Children
              </span>
            </f:if>
            <f:link.action action="list" controller="Room"
                           class="btn btn-sm btn-outline-secondary ms-auto">
              <i class="fa fa-times me-1"></i> Clear Filters
            </f:link.action>
          </div>
        </f:if>
      </div>

      <!-- NO RESULTS -->
      <f:if condition="{rooms -> f:count()} == 0">
        <div class="col-12 text-center py-5">
          <i class="fa fa-door-open fa-3x text-muted mb-3 d-block"></i>
          <h5 class="text-muted">No rooms available for your selection.</h5>
          <p class="text-muted">Try different dates or guest numbers.</p>
          <f:link.action action="list" controller="Room" class="btn btn-primary mt-2">
            <i class="fa fa-rotate-left me-1"></i> Reset Search
          </f:link.action>
        </div>
      </f:if>

      <f:render partial="Room/Cards" arguments="{rooms: rooms, site: site, filterData: filterData, offerPrices: offerPrices, priceBreakdowns: priceBreakdowns, activityMessages: activityMessages}" />

    </div>
  </div>

  <!-- Compare Bar -->
  <div id="compareBar" class="compare-bar d-none">
    <div class="compare-bar-inner">
      <span class="compare-bar-text">
        <span id="compareCount" class="compare-badge">0</span> Rooms selected
      </span>
      <div class="compare-bar-actions">
        <button id="clearCompare" class="btn btn-sm btn-outline-light me-2">
          <i class="fa fa-times me-1"></i> Clear
        </button>
        <button id="openCompare" class="btn btn-sm btn-primary" disabled>
          <i class="fa fa-table-columns me-1"></i>
          Compare Rooms <i class="fa fa-arrow-right ms-1"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Compare Modal -->
  <div id="compareModal" class="compare-modal-overlay d-none">
    <div class="compare-modal">
      <div class="compare-modal-header">
        <h4 class="mb-0 text-white">
          <i class="fa fa-table-columns me-2 text-primary "></i>Room Comparison
        </h4>
        <button id="closeCompare" class="btn-close btn-close-white"></button>
      </div>
      <div class="compare-modal-body">
        <div id="compareTableWrapper" class="table-responsive"></div>
      </div>
    </div>
  </div>

</f:section>
